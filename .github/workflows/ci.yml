name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra test --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  web-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: uv build --wheel --no-sources
      - run: uv venv /tmp/epiq-wheel
      - run: uv pip install --python /tmp/epiq-wheel/bin/python --no-deps dist/*.whl
      - run: /tmp/epiq-wheel/bin/python scripts/check_wheel.py --web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
