[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epiq"
version = "0.1.0"
description = "A local-first epistemic database and research DSL for evidence-backed agent work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "John Horton"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.8"]
web = ["fastapi>=0.115", "uvicorn>=0.34"]
web-test = ["httpx>=0.28"]

[project.scripts]
epiq = "epiq.cli:main"
epiq-web = "epiq.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epiq"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
